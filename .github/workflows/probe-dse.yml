name: Probe DSE archive

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bdshare==1.2.9
      - run: python scripts/probe_dse.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-html
          path: probe_out/
          retention-days: 7
