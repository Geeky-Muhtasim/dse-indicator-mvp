name: Daily DSE update

# DSE trades 10:00 to 14:30 Dhaka time, Sunday to Thursday. Day-end data is usually
# published within the hour, so this runs at 15:30 and again at 17:30 Dhaka (UTC+6)
# in case the first attempt is too early. Re-running is safe: it only adds new sessions.
on:
  schedule:
    - cron: "30 9 * * 0-4"
    - cron: "30 11 * * 0-4"
  workflow_dispatch:
    inputs:
      force_score:
        description: "Rescore even if DSE returned no new session"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch new DSE sessions and rescore
        run: python pipeline/cli.py update ${{ inputs.force_score && '--force-score' || '' }}
      - name: Sanity tests on the new data
        run: python -m pytest -q tests/test_api_and_updates.py
      - name: Commit if anything changed
        run: |
          git config user.name "dse-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/app
          if git diff --cached --quiet; then
            echo "No new data"
          else
            ASOF=$(python -c "import json;print(json.load(open('data/app/meta.json'))['asof'])")
            git commit -m "data: DSE session ${ASOF}"
            git push
          fi
