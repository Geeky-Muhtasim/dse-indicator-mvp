name: Backfill history and retrain

# One-off (or occasional) job: rebuild the full price history from DSE's day-end archive,
# adjust for bonus and rights issues, check it against the existing history, retrain,
# and commit. Nothing is written if the validation check fails.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to fetch (YYYY-MM-DD)"
        default: "2020-01-01"
      min_consistency:
        description: "Share of overlapping symbols that must match the existing history"
        default: "0.9"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"       # stream progress lines into the Actions log
  BDSHARE_SOURCE: legacy      # DSE's newer JSON API answers 403 to GitHub runners

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch, adjust, validate and retrain
        run: python pipeline/cli.py backfill --start "${{ inputs.start }}" --min-consistency "${{ inputs.min_consistency }}"
      - run: python -m pytest -q
      - name: Commit
        run: |
          git config user.name "dse-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history data/model data/app reports
          git diff --cached --quiet || (git commit -m "data: backfill DSE history from ${{ inputs.start }} and retrain" && git push)
